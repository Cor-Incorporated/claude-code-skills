name: CI — Hook Quality

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on hook scripts
        run: |
          # First pass: show all findings (warnings + errors) for visibility
          shellcheck hooks/*.sh || true
          # Second pass: fail only on errors (severity "error")
          shellcheck -S error hooks/*.sh

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          errors=0
          for f in hooks/*.sh scripts/*.sh setup.sh; do
            if [ -f "$f" ]; then
              if ! bash -n "$f" 2>/dev/null; then
                echo "SYNTAX ERROR: $f"
                bash -n "$f" 2>&1 || true
                errors=$((errors + 1))
              fi
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors file(s) have syntax errors"
            exit 1
          fi
          echo "All files passed syntax check"

  json-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          errors=0
          for f in settings.json .claude/settings.local.json; do
            if [ -f "$f" ]; then
              if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
                echo "INVALID JSON: $f"
                python3 -m json.tool "$f" 2>&1 || true
                errors=$((errors + 1))
              else
                echo "OK: $f"
              fi
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors file(s) have JSON syntax errors"
            exit 1
          fi
          echo "All JSON files are valid"

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run hook test suites
        run: |
          errors=0
          for f in tests/test-*.sh; do
            if [ -f "$f" ]; then
              echo "--- Running: $f ---"
              if ! bash "$f"; then
                echo "FAILED: $f"
                errors=$((errors + 1))
              fi
              echo ""
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors test suite(s) failed"
            exit 1
          fi
          echo "All hook tests passed"
