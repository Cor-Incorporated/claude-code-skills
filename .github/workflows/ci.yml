name: CI — Hook Quality

on:
  pull_request:
  push:
    branches: [main, develop]

# 最小権限を明示する。未宣言だと既定がリポジトリ/組織の設定依存になり、
# リポジトリの中身からは読めない。scripts/workflow-permission-scan.py が
# この 4 job を UNDECIDABLE-PERMS として報告したのが、本ブロック追加の直接の理由
# （検査器が「判定できない」と言えることの実利）。aidd-governance#94
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck on hook scripts
        run: |
          # First pass: show all findings (warnings + errors) for visibility
          shellcheck hooks/*.sh || true
          # Second pass: fail only on errors (severity "error")
          shellcheck -S error hooks/*.sh

  vendor-lint:
    # aidd-governance#152: 正本の検査集合が消費側の検査集合を包含していないため、
    # 正本の欠陥が 3 回とも「消費側の CI」でしか検出されなかった。
    #
    # 上の shellcheck job が見ているのは hooks/*.sh だけで、**scripts/ を一度も
    # 見ていない**。そのため vendor される scripts/h5-admission-check.sh の
    # SC2034 が 2 件、どちらのリポジトリの CI も通過していた（2026-09-03 実測）。
    #
    # この job は .aidd-h5-vendor-lint が宣言した検査集合を実際に走らせる。
    # 宣言と実行器は消費側へ vendor され、スタンプで sha256 固定されるので、
    # 片方だけ検査を足すと vendor parity が落ちる。
    name: vendor-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Run declared check set on vendored artifacts
        run: bash scripts/h5-vendor-lint.sh
      - name: Falsifiability of the declaration itself
        run: bash tests/test-h5-vendor-lint.sh

  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          errors=0
          for f in hooks/*.sh scripts/*.sh setup.sh; do
            if [ -f "$f" ]; then
              if ! bash -n "$f" 2>/dev/null; then
                echo "SYNTAX ERROR: $f"
                bash -n "$f" 2>&1 || true
                errors=$((errors + 1))
              fi
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors file(s) have syntax errors"
            exit 1
          fi
          echo "All files passed syntax check"

  json-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: |
          errors=0
          for f in settings.json .claude/settings.local.json; do
            if [ -f "$f" ]; then
              if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
                echo "INVALID JSON: $f"
                python3 -m json.tool "$f" 2>&1 || true
                errors=$((errors + 1))
              else
                echo "OK: $f"
              fi
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors file(s) have JSON syntax errors"
            exit 1
          fi
          echo "All JSON files are valid"

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Install PyYAML
        # tests/test-workflow-permission-scan.sh が要求する。無いと検査器は
        # exit 2 で落ちる（fail-open しない）ので、ここで確実に入れる。
        run: python3 -m pip install --quiet --break-system-packages pyyaml
      - name: Run hook test suites
        run: |
          errors=0
          for f in tests/test-*.sh; do
            if [ -f "$f" ]; then
              echo "--- Running: $f ---"
              if ! bash "$f"; then
                echo "FAILED: $f"
                errors=$((errors + 1))
              fi
              echo ""
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "$errors test suite(s) failed"
            exit 1
          fi
          echo "All hook tests passed"

  workflow-permissions:
    # aidd-governance#94: step が呼ぶ GitHub API 面と job の permissions を機械照合する。
    # 2026-08-27 の Grift Alpha CD は、step を足したのに job の permissions を足さず
    # 403 で停止した。actionlint 1.7.12 はその workflow に対し exit 0 を返す（実測）。
    # --strict-undecidable: 判定不能も落とす。判定できない状態を緑と呼ばないため。
    name: workflow-permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --quiet --break-system-packages pyyaml
      - name: Scan workflows for API-surface vs permissions gaps
        run: python3 scripts/workflow-permission-scan.py --root . --strict-undecidable
      - name: Falsification suite (negative test + truth table)
        run: bash tests/test-workflow-permission-scan.sh
