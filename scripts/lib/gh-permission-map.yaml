# GitHub API 面 → job permissions スコープの対応表（H5/P2 追補・aidd-governance#94）
#
# 使い方の原則 — この表に無いものは PASS ではなく UNDECIDABLE になる。
#   scripts/workflow-permission-scan.py は、`evidence` が空でないエントリにだけ
#   MISSING（= exit 1）判定を与える。根拠のない対応づけで workflow を落とすと
#   検査器自身が二重管理の発生源になるため（aidd-governance#98「検証器が自ら
#   前提を撒いて欠陥を吸収する」の裏返し）。
#
# evidence の種別:
#   measured:<ref>  実際に 403 / 200 を観測した記録がある
#   docs:<url>      GitHub の fine-grained PAT 権限リファレンスで確認した
#   observed:<ref>  本リポジトリの稼働中 workflow で成立が確認できる
#
# 表を増やすときは evidence を必ず書く。書けないなら足さない
# （足さなくても UNDECIDABLE として一覧には出るので、隠れない）。

# ---- REST パス（gh api / curl https://api.github.com/...）----
# match: パス。`{...}` は 1 セグメントのワイルドカード。
#        スキャナは変数展開（$SHA / ${{ ... }}）も `{}` に正規化してから突合する。
# method: GET | POST | PUT | PATCH | DELETE | ANY
rest:
  - match: "repos/{owner}/{repo}/commits/{ref}/check-runs"
    method: GET
    scope: checks
    level: read
    evidence: >-
      measured:aidd-governance#94 — 2026-08-27 Grift Alpha CD の job
      "Authorize exact develop head" が permissions: contents:read のみで本
      エンドポイントを呼び HTTP 403 "Resource not accessible by integration"。
      job へ checks: read を追加して解消。本件がこの検査器を作らせた欠陥そのもの。

  - match: "repos/{owner}/{repo}/pulls/{pull_number}"
    method: GET
    scope: pull-requests
    level: read
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Repository permissions for \"Pull requests\"" 節に read として掲載
      （2026-09-02 参照）。

  - match: "repos/{owner}/{repo}/contents/{path}"
    method: GET
    scope: contents
    level: read
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Repository permissions for \"Contents\"" 節に read として掲載
      （2026-09-02 参照）。

  - match: "repos/{owner}/{repo}/issues/{issue_number}/comments"
    method: POST
    scope: issues
    level: write
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Repository permissions for \"Issues\"" 節に write として掲載
      （2026-09-02 参照）。

  - match: "repos/{owner}/{repo}/actions/runs"
    method: GET
    scope: actions
    level: read
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Repository permissions for \"Actions\"" 節に read として掲載
      （2026-09-02 参照）。

  - match: "repos/{owner}/{repo}/issues/{issue_number}"
    method: GET
    scope: issues
    level: read
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Repository permissions for \"Issues\"" 節に read として掲載（2026-09-02 参照）。

  - match: "repos/{owner}/{repo}/issues/{issue_number}"
    method: PATCH
    scope: issues
    level: write
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Repository permissions for \"Issues\"" 節に write として掲載（2026-09-02 参照）。

  - match: "repos/{owner}/{repo}/issues/{issue_number}/comments"
    method: GET
    any_of:
      - scope: issues
        level: read
      - scope: pull-requests
        level: read
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — 本エンドポイントは "Issues"(read) と "Pull requests"(read) の**両方**の節に
      掲載されている（2026-09-02 実測）。PR のコメントは issue コメントとして
      読まれるため、どちらか一方があれば足りる。単一スコープで書くと、
      pull-requests だけを宣言した正しい workflow に偽 MISSING を出す。

  - match: "repos/{owner}/{repo}/issues/comments/{comment_id}"
    method: DELETE
    any_of:
      - scope: issues
        level: write
      - scope: pull-requests
        level: write
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Issues"(write) と "Pull requests"(write) の両方の節に掲載（2026-09-02 実測）。

  - match: "repos/{owner}/{repo}/issues/comments/{comment_id}"
    method: PATCH
    any_of:
      - scope: issues
        level: write
      - scope: pull-requests
        level: write
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Issues"(write) と "Pull requests"(write) の両方の節に掲載（2026-09-02 実測）。

  - match: "repos/{owner}/{repo}/pulls/{pull_number}/comments"
    method: POST
    scope: pull-requests
    level: write
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Repository permissions for \"Pull requests\"" 節に write として掲載。
      issues 側の節には無い（レビューコメントは PR 固有）（2026-09-02 実測）。

  - match: "repos/{owner}/{repo}/actions/runs/{run_id}"
    method: GET
    scope: actions
    level: read
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — "Repository permissions for \"Actions\"" 節に
      `GET /repos/{owner}/{repo}/actions/runs/{run_id} | read` として掲載（2026-09-02 参照）。

# ---- gh CLI サブコマンド（gh <command> <subcommand>）----
gh_commands:
  - match: "pr view"
    scope: pull-requests
    level: read
    evidence: >-
      observed:claude-code-skills .github/workflows/h5-admission.yml — job が
      permissions: contents:read + pull-requests:read を宣言し、その step が
      scripts/h5-admission-check.sh:49 の `gh pr view --json body` を実行して
      required check として緑になっている。

  - match: "issue view"
    scope: issues
    level: read
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — `GET /repos/{owner}/{repo}/issues/{issue_number}` が "Issues"(read) に掲載。
      gh issue view はこの issue 本体の読み取りに相当する（2026-09-02 参照）。

  - match: "issue edit"
    scope: issues
    level: write
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — `PATCH /repos/{owner}/{repo}/issues/{issue_number}` が "Issues"(write) に掲載。
      gh issue edit は issue 本体の更新に相当する（2026-09-02 参照）。

  - match: "issue comment"
    any_of:
      - scope: issues
        level: write
      - scope: pull-requests
        level: write
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — `POST /repos/{owner}/{repo}/issues/{issue_number}/comments` は
      "Issues"(write) と "Pull requests"(write) の**両方**の節に掲載（2026-09-02 実測）。

  - match: "pr comment"
    any_of:
      - scope: pull-requests
        level: write
      - scope: issues
        level: write
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — gh pr comment は `POST /repos/{owner}/{repo}/issues/{issue_number}/comments`
      を使う（PR コメントは issue コメントとして格納される）。同エンドポイントは
      "Pull requests"(write) と "Issues"(write) の**両方**の節に掲載されている
      （2026-09-02 実測）。どちらか一方で足りるため any_of で書く。単一スコープに
      すると、もう片方を宣言した正しい workflow に偽 MISSING を出す。

  - match: "run view"
    scope: actions
    level: read
    evidence: >-
      docs:https://docs.github.com/en/rest/authentication/permissions-required-for-fine-grained-personal-access-tokens
      — `GET /repos/{owner}/{repo}/actions/runs/{run_id}` が "Actions"(read) に掲載
      （2026-09-02 実測）。

# ---- uses: アクション ----
# ここに無い action は UNDECIDABLE-API（第三者 action の API 面は静的に読めない）。
actions:
  - match: "actions/checkout"
    scope: contents
    level: read
    evidence: >-
      observed:claude-code-skills / aidd-governance 双方の workflow が
      permissions: contents:read の下で actions/checkout@v4 を実行し成功している。

# ---- actions/github-script の script 本文 namespace → スコープ ----
# github.rest.<namespace>.<method> の namespace を写す。method 名が
# get/list/check/compare で始まれば read、それ以外は write とみなす。
# この推定は「evidence 付き」ではないので判定は UNDECIDABLE-API に落とす
# （一覧には出るが exit 1 にはしない）。
github_script_namespaces:
  pulls: pull-requests
  issues: issues
  checks: checks
  actions: actions
  repos: contents
