# DeepSeek Harness (dsh) profile patch for the H17 common control.
#
# dsh has no native hook API; it ships `@deepseek-ai/dsh-hooks-claude-code`, a bridge
# that runs a Claude Code hooks config (SessionStart / UserPromptSubmit / PreToolUse /
# PostToolUse / Stop) inside agent runs.  Mounting it with `configPath` pointed at the
# deployed Claude Code settings puts the SAME oracle (hooks/lib/aidd_cc.py, via
# ~/.claude/hooks/aidd-cc-claude.sh) on the dsh entry.  Stop -> "force another step
# with a reason" is the dsh equivalent of the Claude Stop block.
#
# Install (experiment profile, never the default one):
#   DSH_HOME=~/.dsh-aidd  dsh plugin --profile aidd  ...   # or copy into
#   $DSH_HOME/profiles/aidd/cordis.patch.yml after `--from-default-profile headless`
#
# Session-log upload and product telemetry are DISABLED here: dot's handover
# (minimal-harness-replan-20261012.md) flagged the default-on session log upload;
# business code must not be sent to DeepSeek as training/session logs.
#
# aidd-governance#179 (2026-10-14 05:11Z live): the bridge's Stop payload carries no
# last_assistant_message and an empty transcript_path, so the evidence gate cannot judge the
# report through this bridge (PreToolUse / PostToolUse / UserPromptSubmit do work).  The native
# plugin `aidd-cc-native.mts` (same directory) reads the assistant text from the session event log
# at agent/turn-stopping and calls the same oracle; enable it INSTEAD of the Stop half of the
# bridge once it has been exercised on a live dsh (unverified here: the dsh core packages are
# npm-restricted on this machine).  Keep the bridge entry for the tool / prompt points.
#
# - insert:
#     - id: aidd-cc-native
#       name: ./aidd-cc-native.mts
#       config:
#         oracle: !!js `${process.env.HOME}/.claude/hooks/lib/aidd_cc.py`
#         maxSteers: 2

- insert:
    - id: aidd-cc-hooks
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: !!js process.env.AIDD_CC_HOOKS_CONFIG ?? `${process.env.HOME}/.claude/settings.json`
        projectDir: !!js process.cwd()
        defaultTimeoutMs: 15000

- id: session-log-deepseek
  disabled: true

- id: session-telemetry-otel
  disabled: true

